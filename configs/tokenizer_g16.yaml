# Training runtime; architecture is read from the converted checkpoint.
checkpoint: checkpoints/fvq-init
data: data/demo/tokenizer.jsonl
output: outputs/tokenizer
precision: bf16
seed: 42
lr: 0.0001
min_lr: 0.00001
scheduler: cosine
warmup_steps: 10000
steps: 1000000
betas: [0.9, 0.999]
weight_decay: 0.0
clip_grad: 1.0
accumulation: 1
save_steps: 25000
min_pixels: 3136
max_pixels: 524288 # 2048 patches at patch size 16
